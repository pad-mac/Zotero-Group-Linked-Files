name: Release

# Publish a GitHub release with a tag like v0.1.1 (Releases → Draft a new release).
# This workflow builds the .xpi with that version, tests it inside Zotero and attaches
# it together with update.json. Installed copies update themselves from there.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build
        run: node scripts/build.mjs --version "$TAG"
      - name: Install Xvfb and Zotero dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libdbus-glib-1-2 libgtk-3-0 libasound2t64 || \
          sudo apt-get install -y -q xvfb libdbus-glib-1-2 libgtk-3-0 libasound2
      - name: Test the built .xpi inside Zotero
        run: XPI="$(ls build/*.xpi)" bash test/integration/run.sh
      - name: Attach .xpi and update.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/*.xpi build/update.json --clobber
