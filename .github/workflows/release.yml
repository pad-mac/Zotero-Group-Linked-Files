name: Release

# Publishes a release automatically when the version in manifest.json changes on main:
# builds the .xpi, tests it inside Zotero, and only then creates the release
# v<version> with the .xpi and update.json. Installed copies update themselves.
#
# A release published by hand on GitHub (Releases → Draft a new release) also works:
# the .xpi and update.json are then built and attached to it.
on:
  push:
    branches: [main]
    paths: [manifest.json]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Decide what to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "mode=upload" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(node -p "require('./manifest.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists – nothing to do"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          else
            echo "mode=create" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.mode != 'skip'
        run: npm test
      - if: steps.plan.outputs.mode != 'skip'
        name: Build
        run: node scripts/build.mjs --version "${{ steps.plan.outputs.tag }}"
      - if: steps.plan.outputs.mode != 'skip'
        name: Install Xvfb and Zotero dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libdbus-glib-1-2 libgtk-3-0 libasound2t64 || \
          sudo apt-get install -y -q xvfb libdbus-glib-1-2 libgtk-3-0 libasound2
          pip install --user wsgidav cheroot || pip install --break-system-packages wsgidav cheroot
      - if: steps.plan.outputs.mode != 'skip'
        name: Test the built .xpi inside Zotero
        run: XPI="$(ls build/*.xpi)" bash test/integration/run.sh
      - if: steps.plan.outputs.mode == 'create'
        name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release create "$TAG" build/*.xpi build/update.json \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
      - if: steps.plan.outputs.mode == 'upload'
        name: Attach .xpi and update.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release upload "$TAG" build/*.xpi build/update.json --clobber
